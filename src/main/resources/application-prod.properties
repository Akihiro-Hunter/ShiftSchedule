# 本番(PaaS)用の設定。SPRING_PROFILES_ACTIVE=prod のときだけ読み込まれる。
# 値は環境変数で渡す。DB_* は既定値を持たせない（未設定なら起動に失敗して気づける）。
# 手順は DEPLOY.md を参照。

# PaaS が指定するポートで待ち受ける
server.port=${PORT:8080}

# DB（JDBC形式。例: jdbc:postgresql://ホスト:5432/DB名）
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# リバースプロキシ(HTTPS終端)の X-Forwarded-* を信頼し、https として扱う
server.forward-headers-strategy=framework

# Cookie: HTTPS のみ・JavaScript から読めない・他サイトからの送信を制限
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# 無操作 12時間でセッション切れ（スマホのブックマークから開く運用を考慮）
server.servlet.session.timeout=12h

# エラー内容を画面に出さない
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# SQLの整形ログは不要
spring.jpa.properties.hibernate.format_sql=false
