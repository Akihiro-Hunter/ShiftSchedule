spring.application.name=ShiftSchedule

# PostgreSQL
# 接続情報は環境変数で上書き可能（未設定時は右側の既定値を使用）
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shift_schedule}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# 朝アシシフトの保存は「人数×日数×2」個の項目を送るため、上限を引き上げる
server.tomcat.max-parameter-count=10000

# 初期管理者（管理者が1人もいない場合に起動時に作成）
# ユーザー番号・パスワードは config/application.properties に書く（Git に上げない）
#   app.initial-manager.user-number=半角数字8桁
#   app.initial-manager.password=半角英数字8文字以上

# 動作確認用アルバイト（任意。設定時、そのユーザー番号が未登録なら起動時に作成）
#   app.initial-user.user-number=半角数字8桁
#   app.initial-user.password=半角英数字8文字以上
#   app.initial-user.name=表示名（省略時「テストユーザー」）
