<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<!-- 共通の <head>。th:replace="~{fragments/layout :: head('画面名')}" で使う -->
<head th:fragment="head(title)">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="${title} + ' | 朝アシシフト'">朝アシシフト</title>
<link rel="stylesheet" th:href="@{/css/app.css}">
<script th:src="@{/js/app.js}" defer></script>
</head>

<body>

	<!-- ヘッダー：左に画面名、右にユーザー名とログアウトボタン -->
	<header th:fragment="header(title, area)" class="app-header">
		<h1 class="app-title" th:text="${title}">画面名</h1>
		<div class="app-user">
			<span class="app-user-name" th:text="${loginName}">氏名</span>
			<form th:action="@{'/' + ${area} + '/logout'}" method="post">
				<button type="submit" class="btn btn-small">ログアウト</button>
			</form>
		</div>
	</header>

	<!-- 保存完了・エラーのメッセージ -->
	<div th:fragment="messages">
		<p class="flash flash-ok" th:if="${message}" th:text="${message}"></p>
		<p class="flash flash-warn" th:if="${warning}" th:text="${warning}"></p>
		<p class="flash flash-error" th:if="${error}" th:text="${error}"></p>
	</div>

	<!-- メニューへ戻るリンク -->
	<a th:fragment="back(area)" class="back-link" th:href="@{'/' + ${area} + '/menu'}">← メニューへ</a>

</body>
</html>
