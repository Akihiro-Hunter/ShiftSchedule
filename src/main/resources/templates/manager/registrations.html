<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('ユーザー登録')}"></head>
<body class="manager">
	<header th:replace="~{fragments/layout :: managerHeader('registrations')}"></header>
	<aside th:replace="~{fragments/layout :: managerSide('registrations')}"></aside>
	<main class="container">
		<div class="toolbar">
			<a class="btn btn-primary" th:href="@{/manager/registrations/new}">＋ 新規登録</a>
		</div>
		<div th:replace="~{fragments/layout :: messages}"></div>

		<div class="table-wrap">
			<table class="table table-fixed">
					<colgroup>
						<col style="width: 14%"><col style="width: 18%"><col style="width: 12%"><col style="width: 14%"><col style="width: 14%"><col style="width: 14%"><col style="width: 14%">
					</colgroup>
				<thead>
					<tr>
						<th><a class="sort" th:href="@{/manager/registrations(sort='userNumber',dir=${sort == 'userNumber' and dir == 'asc' ? 'desc' : 'asc'})}">ユーザー番号<span class="sort-mark" th:if="${sort == 'userNumber'}" th:text="${dir == 'asc' ? '▲' : '▼'}"></span></a></th>
						<th><a class="sort" th:href="@{/manager/registrations(sort='name',dir=${sort == 'name' and dir == 'asc' ? 'desc' : 'asc'})}">氏名<span class="sort-mark" th:if="${sort == 'name'}" th:text="${dir == 'asc' ? '▲' : '▼'}"></span></a></th>
						<th><a class="sort" th:href="@{/manager/registrations(sort='role',dir=${sort == 'role' and dir == 'asc' ? 'desc' : 'asc'})}">役職<span class="sort-mark" th:if="${sort == 'role'}" th:text="${dir == 'asc' ? '▲' : '▼'}"></span></a></th>
						<th><a class="sort" th:href="@{/manager/registrations(sort='birthDate',dir=${sort == 'birthDate' and dir == 'asc' ? 'desc' : 'asc'})}">生年月日<span class="sort-mark" th:if="${sort == 'birthDate'}" th:text="${dir == 'asc' ? '▲' : '▼'}"></span></a></th>
						<th><a class="sort" th:href="@{/manager/registrations(sort='hireDate',dir=${sort == 'hireDate' and dir == 'asc' ? 'desc' : 'asc'})}">入社日<span class="sort-mark" th:if="${sort == 'hireDate'}" th:text="${dir == 'asc' ? '▲' : '▼'}"></span></a></th>
						<th class="num"><a class="sort" th:href="@{/manager/registrations(sort='contractDays',dir=${sort == 'contractDays' and dir == 'asc' ? 'desc' : 'asc'})}">契約勤務日数<span class="sort-mark" th:if="${sort == 'contractDays'}" th:text="${dir == 'asc' ? '▲' : '▼'}"></span></a></th>
						<th><a class="sort" th:href="@{/manager/registrations(sort='time',dir=${sort == 'time' and dir == 'asc' ? 'desc' : 'asc'})}">契約時間<span class="sort-mark" th:if="${sort == 'time'}" th:text="${dir == 'asc' ? '▲' : '▼'}"></span></a></th>
					</tr>
				</thead>
				<tbody>
					<tr class="row-link" th:each="a : ${accounts}">
						<td th:text="${a.userNumber}"></td>
						<td><a th:href="@{/manager/registrations/{id}(id=${a.id})}" th:text="${a.name}"></a></td>
						<td><span class="badge" th:classappend="${a.role.name() == 'MANAGER'} ? 'badge-manager' : (${a.role.name() == 'PART'} ? 'badge-part')"
								th:text="${a.role.label}"></span></td>
						<td th:text="${a.birthDate} ? ${#temporals.format(a.birthDate, 'yyyy/MM/dd')}"></td>
						<td th:text="${a.hireDate} ? ${#temporals.format(a.hireDate, 'yyyy/MM/dd')}"></td>
						<td class="num" th:text="|週${a.contractDays}日|"></td>
						<td th:text="${#temporals.format(a.startTime, 'HH:mm')} + '〜' + ${#temporals.format(a.endTime, 'HH:mm')}"></td>
					</tr>
					<tr th:if="${#lists.isEmpty(accounts)}">
						<td colspan="7" class="empty">ユーザーが登録されていません</td>
					</tr>
				</tbody>
			</table>
		</div>
	</main>
</body>
</html>
