<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('ユーザー情報管理')}"></head>
<body class="manager">
	<header th:replace="~{fragments/layout :: managerHeader('users')}"></header>
	<aside th:replace="~{fragments/layout :: managerSide('users')}"></aside>
	<main class="container">
		<div th:replace="~{fragments/layout :: messages}"></div>

		<div class="table-wrap">
			<table class="table table-fixed">
					<colgroup>
						<col style="width: 13%"><col style="width: 14%"><col style="width: 10%"><col style="width: 10%"><col style="width: 13%"><col style="width: 10%"><col style="width: 30%">
					</colgroup>
				<thead>
					<tr>
						<th><a class="sort" th:href="@{/manager/users(sort='userNumber',dir=${sort == 'userNumber' and dir == 'asc' ? 'desc' : 'asc'})}">ユーザー番号<span class="sort-mark" th:if="${sort == 'userNumber'}" th:text="${dir == 'asc' ? '▲' : '▼'}"></span></a></th>
						<th><a class="sort" th:href="@{/manager/users(sort='name',dir=${sort == 'name' and dir == 'asc' ? 'desc' : 'asc'})}">氏名<span class="sort-mark" th:if="${sort == 'name'}" th:text="${dir == 'asc' ? '▲' : '▼'}"></span></a></th>
						<th><a class="sort" th:href="@{/manager/users(sort='role',dir=${sort == 'role' and dir == 'asc' ? 'desc' : 'asc'})}">役職<span class="sort-mark" th:if="${sort == 'role'}" th:text="${dir == 'asc' ? '▲' : '▼'}"></span></a></th>
						<th><a class="sort" th:href="@{/manager/users(sort='priority',dir=${sort == 'priority' and dir == 'asc' ? 'desc' : 'asc'})}">優先度<span class="sort-mark" th:if="${sort == 'priority'}" th:text="${dir == 'asc' ? '▲' : '▼'}"></span></a></th>
						<th><a class="sort" th:href="@{/manager/users(sort='hireDate',dir=${sort == 'hireDate' and dir == 'asc' ? 'desc' : 'asc'})}">入社日<span class="sort-mark" th:if="${sort == 'hireDate'}" th:text="${dir == 'asc' ? '▲' : '▼'}"></span></a></th>
						<th class="num"><a class="sort" th:href="@{/manager/users(sort='paidLeaveDays',dir=${sort == 'paidLeaveDays' and dir == 'asc' ? 'desc' : 'asc'})}">残有給<span class="sort-mark" th:if="${sort == 'paidLeaveDays'}" th:text="${dir == 'asc' ? '▲' : '▼'}"></span></a></th>
						<th><a class="sort" th:href="@{/manager/users(sort='tasks',dir=${sort == 'tasks' and dir == 'asc' ? 'desc' : 'asc'})}">可能作業<span class="sort-mark" th:if="${sort == 'tasks'}" th:text="${dir == 'asc' ? '▲' : '▼'}"></span></a></th>
					</tr>
				</thead>
				<tbody>
					<tr class="row-link" th:each="a : ${accounts}">
						<td th:text="${a.userNumber}"></td>
						<td><a th:href="@{/manager/users/{id}(id=${a.id})}" th:text="${a.name}"></a></td>
						<td><span class="badge" th:classappend="${a.role.name() == 'MANAGER'} ? 'badge-manager' : (${a.role.name() == 'PART'} ? 'badge-part')"
								th:text="${a.role.label}"></span></td>
						<td th:text="${a.priority.label}"></td>
						<td th:text="${a.hireDate} ? ${#temporals.format(a.hireDate, 'yyyy/MM/dd')}"></td>
						<td class="num" th:text="${a.paidLeaveDays} + '日'"></td>
						<td class="wrap" th:text="${a.tasksLabel}"></td>
					</tr>
					<tr th:if="${#lists.isEmpty(accounts)}">
						<td colspan="7" class="empty">ユーザーが登録されていません（「ユーザー登録」から登録してください）</td>
					</tr>
				</tbody>
			</table>
		</div>
	</main>
</body>
</html>
