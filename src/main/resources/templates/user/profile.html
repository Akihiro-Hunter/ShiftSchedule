<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('個人情報設定')}"></head>
<body class="user">
	<header th:replace="~{fragments/layout :: header('個人情報設定', 'user')}"></header>
	<main class="container">
		<a th:replace="~{fragments/layout :: back('user')}"></a>
		<div th:replace="~{fragments/layout :: messages}"></div>

		<section class="card">
			<h3 class="card-title">個人情報</h3>
			<dl class="info">
				<dt>氏名</dt>
				<dd th:text="${account.name}"></dd>
				<dt>ユーザー番号</dt>
				<dd th:text="${account.userNumber}"></dd>
				<dt>生年月日</dt>
				<dd th:text="${account.birthDate} ? ${#temporals.format(account.birthDate, 'yyyy年M月d日')} : '-'"></dd>
				<dt>入社日</dt>
				<dd th:text="${account.hireDate} ? ${#temporals.format(account.hireDate, 'yyyy年M月d日')} : '-'"></dd>
				<dt>残年次有給休暇数</dt>
				<dd th:text="${account.paidLeaveDays} + '日'"></dd>
				<dt>可能作業</dt>
				<dd th:text="${#strings.isEmpty(account.tasksLabel)} ? '-' : ${account.tasksLabel}"></dd>
			</dl>
			<p class="hint">個人情報の変更は管理者に依頼してください。</p>
		</section>

		<section class="card">
			<h3 class="card-title">パスワード変更</h3>
			<form th:action="@{/user/profile/password}" th:object="${passwordForm}" method="post" class="form">
				<label class="form-row">
					<span class="form-label">現在のパスワード</span>
					<input type="password" th:field="*{currentPassword}" autocomplete="current-password" required>
					<span class="field-error" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></span>
				</label>
				<label class="form-row">
					<span class="form-label">新しいパスワード</span>
					<input type="password" th:field="*{newPassword}" pattern="[A-Za-z0-9]{8,}" title="半角英数字8文字以上"
						autocomplete="new-password" required>
					<span class="hint">半角英数字8文字以上</span>
					<span class="field-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></span>
				</label>
				<label class="form-row">
					<span class="form-label">新しいパスワード（確認）</span>
					<input type="password" th:field="*{confirmPassword}" autocomplete="new-password" required>
					<span class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
				</label>
				<button type="submit" class="btn btn-primary btn-block">変更する</button>
			</form>
		</section>
	</main>
</body>
</html>
