<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('可能作業')}"></head>
<body class="user">
	<header th:replace="~{fragments/layout :: header('可能作業', 'user')}"></header>
	<main class="container">
		<a th:replace="~{fragments/layout :: back('user')}"></a>
		<div th:replace="~{fragments/layout :: messages}"></div>

		<form th:action="@{/user/tasks}" method="post" class="card" data-dirty-guard>
			<p class="hint">できる作業にチェックを入れて保存してください。</p>
			<section class="task-group" th:each="g : ${taskGroups}">
				<h3 class="task-group-title" th:text="${g.key.label}"></h3>
				<div class="check-list" th:classappend="${g.key.name() == 'TRUCK'} ? 'check-list-3'">
					<label class="check check-large" th:each="t : ${g.value}">
						<input type="checkbox" name="taskIds" th:value="${t.id}" th:checked="${taskIds.contains(t.id)}">
						<span th:text="${t.label}"></span>
					</label>
				</div>
			</section>
			<button type="submit" class="btn btn-primary btn-block">保存</button>
		</form>
	</main>
</body>
</html>
